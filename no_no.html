<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Do you love me? 🌷</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #fff5f7;
      --pink:  #f28bab;
      --deep:  #d45c82;
      --text:  #3d2030;
      --muted: #b07090;
      --soft:  #ffe0e8;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; position: relative;
    }

    /* scattered tulip SVGs */
    .tulip {
      position: fixed;
      z-index: 1;
      pointer-events: none;
    }

    .card {
      position: relative; z-index: 10;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    }

    .cat-wrap {
      animation: bobble 2.8s ease-in-out infinite;
    }
    @keyframes bobble {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .cat-wrap img { width: 180px; height: 180px; object-fit: contain; display: block; }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900; color: var(--text);
      letter-spacing: -0.01em; line-height: 1.2;
    }

    #quirky {
      min-height: 1.4em; font-size: 0.95rem;
      font-weight: 700; color: var(--deep);
      opacity: 1; transition: opacity 0.2s; font-style: italic;
    }

    .btn-row {
      display: flex; gap: 1rem;
      align-items: center; justify-content: center; margin-top: 0.4rem;
    }

    .btn-yes {
      background: var(--deep); color: #fff; border: none;
      border-radius: 999px; font-family: 'Nunito', sans-serif;
      font-size: 1.05rem; font-weight: 800; padding: 0.7rem 2.2rem;
      cursor: pointer; transition: transform 0.15s, background 0.15s;
      box-shadow: 0 4px 16px rgba(212,92,130,0.3);
    }
    .btn-yes:hover { background: var(--pink); transform: scale(1.06); }
    .btn-yes:active { transform: scale(0.96); }

    /* No button — starts inline, then roams */
    .btn-no {
      background: #fff; color: var(--muted);
      border: 2px solid var(--soft); border-radius: 999px;
      font-family: 'Nunito', sans-serif; font-size: 1.05rem;
      font-weight: 800; padding: 0.7rem 2.2rem;
      cursor: pointer; transition: border-color 0.2s;
    }
    .btn-no:hover { border-color: var(--pink); }
    .btn-no.roaming {
      position: fixed; z-index: 20;
    }

    /* Yes screen */
    #yes-screen { display: none; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; }
    #yes-screen.show { display: flex; }
    #yes-screen .cat-wrap { animation: heartbeat 0.9s ease-in-out infinite; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      15% { transform: scale(1.08); }
      30% { transform: scale(1); }
      45% { transform: scale(1.05); }
    }
    #yes-screen h2 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 900; color: var(--text); line-height: 1.2; }
    #yes-screen p  { color: var(--muted); font-size: 1rem; font-weight: 700; }

    .confetti-piece {
      position: fixed; pointer-events: none; z-index: 100;
      border-radius: 3px; animation: cfall linear forwards;
    }
    @keyframes cfall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(600deg); }
    }
    .floaty {
      position: fixed; pointer-events: none; z-index: 15;
      animation: floatUp linear forwards; font-size: 1.3rem;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-180px) scale(0.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <h2>I love you too! 🌷</h2>
  <p>I knew you would say yes 🥹</p>
</div>

<script>
  const lines = [
    "hey.. where are you going 🥺",
    "the button is running away lol",
    "STOP IT. just click yes 😤",
    "babe.. BABE. 😭",
    "the yes button is literally right there 👀",
    "fine. i'll love you from a distance 🌷",
    "okay i'm actually crying now 😭😭",
    "YOU WILL NOT ESCAPE YES FOREVER 😤",
    "my cat is judging you rn 🐱",
    "every time you click no a tulip cries 🌷💧",
  ];

  let noCount = 0;
  const noBtn    = document.getElementById('btn-no');
  const quirkyEl = document.getElementById('quirky');
  let hasRoamed  = false;

  function makeRoaming() {
    if (hasRoamed) return;
    hasRoamed = true;
    // Grab current screen position of the button
    const r = noBtn.getBoundingClientRect();
    noBtn.classList.add('roaming');
    noBtn.style.left = r.left + 'px';
    noBtn.style.top  = r.top  + 'px';
    noBtn.style.width = r.width + 'px';
  }

  function moveNo() {
    const pad = 20;
    const bw  = noBtn.offsetWidth  || 120;
    const bh  = noBtn.offsetHeight || 48;
    const maxX = window.innerWidth  - bw - pad;
    const maxY = window.innerHeight - bh - pad;

    const yesRect = document.getElementById('btn-yes').getBoundingClientRect();
    let nx, ny, tries = 0;
    do {
      nx = pad + Math.random() * (maxX - pad);
      ny = pad + Math.random() * (maxY - pad);
      tries++;
    } while (tries < 25 && Math.abs(nx - yesRect.left) < 160 && Math.abs(ny - yesRect.top) < 90);

    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';
  }

  function spawnFloaty(x, y) {
    const emojis = ['💔','😭','🥺','😩','🙃','😤','🌷'];
    const el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (x - 10) + 'px';
    el.style.top  = (y - 10) + 'px';
    el.style.animationDuration = (1 + Math.random() * 0.8) + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function onNo() {
    noCount++;
    makeRoaming();
    moveNo();

    if (noCount <= lines.length) {
      quirkyEl.style.opacity = 0;
      setTimeout(() => {
        quirkyEl.textContent = lines[noCount - 1];
        quirkyEl.style.opacity = 1;
      }, 160);
    }

    const r = noBtn.getBoundingClientRect();
    spawnFloaty(r.left + r.width / 2, r.top + r.height / 2);

    if (noCount >= 3) {
      const yesBtn = document.getElementById('btn-yes');
      const s = Math.min(1 + (noCount - 2) * 0.07, 1.6);
      yesBtn.style.transform = 'scale(' + s + ')';
    }
  }

  function launchConfetti() {
    const colors = ['#e8607a','#f28bab','#f9d4c0','#7bbf72','#ffd6e0','#fff','#d45c82'];
    for (let i = 0; i < 90; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left   = (10 + Math.random() * 80) + 'vw';
      el.style.top    = '-12px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width  = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 8) + 'px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
      el.style.animationDuration = (1.8 + Math.random() * 2) + 's';
      el.style.animationDelay   = (Math.random() * 0.6) + 's';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  function onYes() {
    document.getElementById('main-card').style.display = 'none';
    noBtn.style.display = 'none';
    const ys = document.getElementById('yes-screen');
    ys.classList.add('show');
    launchConfetti();
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'floaty';
        el.textContent = ['❤️','🌷','💕','💗','🌸','💖'][Math.floor(Math.random() * 6)];
        el.style.left = (5 + Math.random() * 90) + 'vw';
        el.style.top  = (55 + Math.random() * 35) + 'vh';
        el.style.animationDuration = (1.4 + Math.random()) + 's';
        el.style.fontSize = (1.1 + Math.random() * 1.2) + 'rem';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }, i * 100);
    }
  }
</script>
</body>
</html>
